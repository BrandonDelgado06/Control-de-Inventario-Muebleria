name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Existe la solución?
        id: check
        run: |
          if ls src/backend/*.slnx >/dev/null 2>&1; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.existe == 'true'
        with:
          global-json-file: global.json
      - name: Restaurar
        if: steps.check.outputs.existe == 'true'
        run: dotnet restore src/backend
      - name: Compilar
        if: steps.check.outputs.existe == 'true'
        run: dotnet build src/backend --no-restore -c Release
      - name: Pruebas unitarias
        if: steps.check.outputs.existe == 'true' && hashFiles('tests/Muebleria.UnitTests/*.csproj') != ''
        run: dotnet test tests/Muebleria.UnitTests -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: ¿Existe package.json?
        id: check
        run: |
          if [ -f package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.existe == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - if: steps.check.outputs.existe == 'true'
        run: npm ci
      - if: steps.check.outputs.existe == 'true'
        run: npm run lint
      - if: steps.check.outputs.existe == 'true'
        run: npm run build
